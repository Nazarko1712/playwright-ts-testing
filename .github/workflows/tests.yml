name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly full run: catches breakage from external API drift.
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  # Lint and formatting are their OWN job, not steps inside the test job.
  #
  # They need no browser, no network and no secrets, and they finish in
  # seconds. As a separate job they run concurrently with the suite, so a
  # style failure does not wait behind a ten-minute browser run and a test
  # failure is not hidden behind a style failure. Both verdicts arrive on
  # their own.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

      # `--check`, never `--write`: CI reports, it does not silently rewrite
      # the branch it was asked to verify.
      - name: Prettier
        run: npm run format:check

  # Sharding: each shard runs a slice of the suite in parallel, then the blob
  # reports are merged into one HTML report. This is how you keep wall-clock
  # time flat as the suite grows.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      # Only the browser we actually use, with its OS dependencies.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npx playwright test --shard=${{ matrix.shard }}/2 --reporter=blob

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7

  merge-reports:
    if: ${{ !cancelled() }}
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - run: npx playwright merge-reports --reporter html ./all-blob-reports

      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
